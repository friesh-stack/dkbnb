 case'crane':c.moveTo(-3,6);c.lineTo(-3,-5);c.lineTo(7,-5);c.moveTo(-6,-5);c.lineTo(-3,-5);c.moveTo(5,-5);c.lineTo(5,0);c.stroke();c.fillRect(3,0,4,2.5);break;
 case'plane':c.moveTo(0,-7);c.lineTo(1.2,-1);c.lineTo(7,2);c.lineTo(1.2,1);c.lineTo(1,5);c.lineTo(3,7);c.lineTo(-3,7);c.lineTo(-1,5);c.lineTo(-1.2,1);c.lineTo(-7,2);c.lineTo(-1.2,-1);c.closePath();c.fill();break;
 case'cap':c.moveTo(-7,-1);c.lineTo(0,-5);c.lineTo(7,-1);c.lineTo(0,3);c.closePath();c.fill();c.fillRect(-4,0,8,4);c.fillRect(5.5,-1,1,5);break;
 case'atom':c.ellipse(0,0,7,2.6,.6,0,7);c.stroke();c.beginPath();c.ellipse(0,0,7,2.6,-.6,0,7);c.stroke();c.beginPath();c.arc(0,0,1.6,0,7);c.fill();break;
 case'gear':c.setLineDash([2,1.6]);c.lineWidth=3;c.arc(0,0,5,0,7);c.stroke();c.setLineDash([]);c.beginPath();c.lineWidth=1.4;c.arc(0,0,2,0,7);c.stroke();break;
 case'ball':c.arc(0,0,6,0,7);c.stroke();c.beginPath();for(let i=0;i<5;i++){const a=i*1.2566-1.57;c.lineTo(Math.cos(a)*2.4,Math.sin(a)*2.4)}c.fill();break;
 case'paw':c.arc(0,2.5,3.2,0,7);c.fill();[[-4,-2],[-1.4,-4.5],[1.4,-4.5],[4,-2]].forEach(([a,b])=>{c.beginPath();c.arc(a,b,1.4,0,7);c.fill()});break;
 case'light':c.moveTo(-2.5,7);c.lineTo(-1.5,-4);c.lineTo(1.5,-4);c.lineTo(2.5,7);c.closePath();c.fill();c.fillRect(-3,-7,6,2.5);c.beginPath();c.moveTo(3,-6);c.lineTo(8,-8);c.lineTo(8,-4);c.closePath();c.globalAlpha=.7;c.fill();c.globalAlpha=1;break;
 case'tree':c.moveTo(-5,3);c.lineTo(0,-7);c.lineTo(5,3);c.fill();c.fillRect(-1,3,2,4);break;
 case'castle':c.fillRect(-6,-1,12,7);for(let i=-6;i<6;i+=3)c.fillRect(i,-4,1.8,3);c.fillStyle='#14233f';c.fillRect(-1.2,2,2.4,4);break;
 case'flower':for(let i=0;i<5;i++){const a=i*1.2566;c.beginPath();c.arc(Math.cos(a)*3.2,Math.sin(a)*3.2,2.3,0,7);c.fill()}c.fillStyle='#e2c27a';c.beginPath();c.arc(0,0,1.8,0,7);c.fill();break;
 case'apple':c.arc(0,1.5,5,0,7);c.fill();c.fillRect(-.5,-6,1.2,3);c.beginPath();c.ellipse(2.5,-5,2.4,1.1,-.4,0,7);c.fill();break}
 c.restore()}

const pts=new Map();let moved=0;
function zoomAt(px,py,f){const[kx,ky]=toK(px,py);view.s=Math.max(2/R,Math.min(4000,view.s*f));view.cx=kx-(px-W/2)/view.s;view.cy=ky-(py-H/2)/view.s;draw()}
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);pts.set(e.pointerId,[e.clientX,e.clientY]);if(pts.size===1)moved=0});
cv.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;const p=pts.get(e.pointerId);
 if(pts.size===1){const dx=e.clientX-p[0],dy=e.clientY-p[1];view.cx-=dx/view.s;view.cy-=dy/view.s;moved+=Math.abs(dx)+Math.abs(dy);draw()}
 else if(pts.size===2){const o=[...pts.entries()].find(([k])=>k!==e.pointerId)[1];const d0=Math.hypot(p[0]-o[0],p[1]-o[1]),d1=Math.hypot(e.clientX-o[0],e.clientY-o[1]);
  const m0=[(p[0]+o[0])/2,(p[1]+o[1])/2],m1=[(e.clientX+o[0])/2,(e.clientY+o[1])/2];view.cx-=(m1[0]-m0[0])/view.s;view.cy-=(m1[1]-m0[1])/view.s;if(d0>0)zoomAt(m1[0],m1[1],d1/d0);moved+=99}
 pts.set(e.pointerId,[e.clientX,e.clientY])});
const up=e=>{if(pts.size===1&&moved<14)tap(e.clientX,e.clientY);pts.delete(e.pointerId)};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',e=>pts.delete(e.pointerId));
cv.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.clientX,e.clientY,Math.exp(-e.deltaY*.0015))},{passive:false});
function tap(x,y){if((!quiz||quiz.done)&&lens==='tour'){for(const t of ST){if(!TOUR[t.n])continue;const[a,b]=toS(t.x,t.y);if(Math.hypot(a-x,b-y)<18){const hex=hexAt(t.x,t.y);sel={hex};showBz(t.b,hex&&hex.st===t?hex:{st:t,k:t.k});draw();return}}}
 if(!quiz||quiz.done){if(view.s>=12)for(const l of LM){const[a,b]=toS(l.x,l.y);if(Math.hypot(a-x,b-y)<16){sel=null;showLm(l);draw();return}}}
 for(const c in BZ){const h=BZ[c].hit;if(h&&x>=h[0]&&x<=h[0]+h[2]&&y>=h[1]&&y<=h[1]+h[3]){sel=null;quiz&&!quiz.done?answer(c):showBz(c);draw();return}}

// ----- Orte: zuerst die wöchentlich vorab geholte Datei orte.json (eigener Server), dann Details live (Overpass) beim Heranzoomen -----
let PRE=null,STADT=false;
async function loadPre(){if(PRE)return PRE;PRE='…';for(const u of ['orte.json','https://ostseebnb.de/orte.json'].slice(0,location.pathname.includes('ruegen-spiel')?2:1)){try{const r=await fetch(u,{cache:'no-cache'});if(!r.ok)continue;const j=await r.json();STADT=!!j.stadt;
  for(const k in j.c){const M=ITEMS[k]=ITEMS[k]||new Map();for(const row of j.c[k]){const[lat,lon,name,id,ex]=row,[x,y]=P(lon,lat);M.set(id,{k,x,y,lat,lon,t:Object.assign({name},ex||{}),id:id.slice(1),type:{n:'node',w:'way',r:'relation',q:'wikidata'}[id[0]]})}}
  PRE=j;draw();return j}catch(e){}}PRE='none';return null}
const EP=['https://overpass-api.de/api/interpreter','https://overpass.private.coffee/api/interpreter','https://overpass.kumi.systems/api/interpreter'];
async function fetchOP(q){for(const u of EP){const ac=new AbortController(),to=setTimeout(()=>ac.abort(),15000);try{const r=await fetch(u,{method:'POST',body:'data='+encodeURIComponent(q),headers:{'Content-Type':'application/x-www-form-urlencoded'},signal:ac.signal});clearTimeout(to);if(r.ok)return await r.json()}catch(e){clearTimeout(to)}}throw new Error('op')}
function cls(t,todo){const has=k=>todo.includes(k);
 if(t.amenity==='restaurant'){const c=t.cuisine||'';if(/italian|pizza/.test(c))return has('ita')?'ita':null;if(/greek|gyros|souvlaki/.test(c))return has('gre')?'gre':null;if(/chinese|japanese|thai|vietnamese|asian|sushi|korean|indian|ramen|nepalese|indonesian|malaysian|filipino|pakistani|noodle|dim_sum|bubble_tea|cantonese|sichuan/.test(c))return has('asia')?'asia':null;if(/german|bavarian|schnitzel|currywurst|austrian|regional|local|swiss|french|spanish|tapas|portuguese|hungarian|swedish|danish|norwegian|finnish|nordic|scandinavian/.test(c))return has('ger')?'ger':null;return has('food')&&t.name?'food':null}
 if(has('bus')&&t.highway==='bus_stop')return'bus';if(has('rail')&&/^(station|halt)$/.test(t.railway||''))return'rail';if(has('museum')&&/^(museum|gallery)$/.test(t.tourism||''))return'museum';
 if(has('shop')&&(/^(mall|department_store|supermarket)$/.test(t.shop||'')||t.highway==='pedestrian'))return'shop';if(has('fun')&&(/^(theme_park|zoo|aquarium)$/.test(t.tourism||'')||t.leisure==='water_park'))return'fun';
 if(has('stadium')&&t.leisure==='stadium')return'stadium';if(has('garden')&&/^(garden|park)$/.test(t.leisure||''))return'garden';if(has('view')&&(t.tourism==='viewpoint'||t.man_made==='tower'))return'view';
 if(has('theatre')&&/^(theatre|arts_centre)$/.test(t.amenity||''))return'theatre';if(has('sight')&&(t.tourism==='attraction'||t.historic))return'sight';return null}
let rT=0,lastFar='';function refresh(now){clearTimeout(rT);rT=setTimeout(load,now?50:900)}
async function load(){const cats=[...ON].filter(k=>k!=='weather');if(!cats.length){say('');return}
 if(!PRE){say(L().load);await loadPre();say('')}
 if(STADT)return; // Stadt-Spiele: alles ist vorab geladen
 const w=kmW(),[a,b]=inv(...toK(0,0)),[c,d]=inv(...toK(W,H)),S=Math.min(b,d),N=Math.max(b,d),Wl=Math.min(a,c),E=Math.max(a,c);
 const todo=cats.filter(k=>w<=CAT[k][3]&&!(DONE[k]||[]).some(r=>r[0]<=S&&r[1]<=Wl&&r[2]>=N&&r[3]>=E));
 const empty=cats.filter(k=>!(ITEMS[k]&&ITEMS[k].size)&&w>CAT[k][3]),fk=empty.join();
 if(empty.length&&!todo.length&&fk!==lastFar)say(L().zoom+': '+empty.map(k=>L().c[k]).join(', '),3500);lastFar=fk;
 if(!todo.length||busy)return;
 const pad=.2,dy=(N-S)*pad,dx=(E-Wl)*pad,bb=[S-dy,Wl-dx,N+dy,E+dx],B=bb.map(v=>v.toFixed(4)).join(',');
 busy=1;say(L().load);
 try{const q='[out:json][timeout:15];('+todo.map(k=>CAT[k][2]).join('').replaceAll('(B)','('+B+')')+');out tags center 800;';const j=await fetchOP(q);
  todo.forEach(k=>{(DONE[k]=DONE[k]||[]).push(bb);ITEMS[k]=ITEMS[k]||new Map()});
  for(const e of j.elements||[]){const lat=e.lat??e.center?.lat,lon=e.lon??e.center?.lon;if(lat==null)continue;const k=cls(e.tags||{},todo);if(!k)continue;const[x,y]=P(lon,lat);ITEMS[k].set(e.type[0]+e.id,{k,x,y,lat,lon,t:e.tags||{},id:e.id,type:e.type})}
  busy=0;say('');draw()}
 catch(e){busy=0;say(L().err,4000)}}
// ----- Wetter (Open-Meteo) -----
let WX=null,wxT=0;const WXI=c=>c===0?'☀️':c<=2?'🌤':c===3?'☁️':c<=48?'🌫':c<=67?'🌧':c<=77?'🌨':c<=82?'🌦':c<=86?'🌨':'⛈';
async function loadWx(){if(WX&&Date.now()-wxT<9e5)return;try{const pts=ST.map(t=>inv(t.x,t.y)),out=[];
 for(let i=0;i<pts.length;i+=90){const p=pts.slice(i,i+90);const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${p.map(q=>q[1].toFixed(3)).join(',')}&longitude=${p.map(q=>q[0].toFixed(3)).join(',')}&current=temperature_2m,weather_code,wind_speed_10m&timezone=auto`);
  const j=await r.json();out.push(...(Array.isArray(j)?j:[j]))}
 WX=out.map(o=>o.current);wxT=Date.now();draw()}catch(e){say(L().err,4000)}}
setInterval(()=>{if(ON.has('weather')){wxT=0;loadWx()}},9e5);
// ----- Zeichnen -----
let CL=[];
const _paint=paint;paint=function(){_paint();if(view.s>=OSM_S&&OSM===null)askOsm();const st=drawOsm();CL=[];if(FOC&&Date.now()-FOC.t<6000){const[fx,fy]=toS(FOC.x,FOC.y);ctx.save();ctx.strokeStyle='#ff3b6b';ctx.lineWidth=4;ctx.beginPath();ctx.arc(fx,fy,22,0,7);ctx.stroke();ctx.restore();setTimeout(draw,500)}if(!ON.size)return;const s=view.s,occ=[];
 for(const k of Object.keys(CAT)){if(!ON.has(k)||!ITEMS[k])continue;const[ic,col]=CAT[k],r=kmW()<3?13:10;ctx.font=`${r+2}px system-ui,"Apple Color Emoji","Segoe UI Emoji",sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
  const g=new Map(),cs=2*r+8;for(const it of ITEMS[k].values()){const[x,y]=toS(it.x,it.y);if(x<-20||x>W+20||y<-20||y>H+20)continue;const key=Math.floor(x/cs)+','+Math.floor(y/cs);const c=g.get(key);if(c){c.n++;c.sx+=x;c.sy+=y}else g.set(key,{it,x,y,n:1,sx:x,sy:y})}
  for(const c of g.values()){const x=c.n>1?c.sx/c.n:c.x,y=c.n>1?c.sy/c.n:c.y;CL.push({x,y,c});
   ctx.beginPath();ctx.arc(x,y,r+3,0,7);ctx.fillStyle='rgba(10,16,30,.88)';ctx.fill();ctx.lineWidth=2;ctx.strokeStyle=col;ctx.stroke();ctx.fillStyle='#fff';ctx.fillText(ic,x,y+1);
   if(c.n>1){ctx.save();ctx.font='700 10px Inter,sans-serif';const t2=c.n>99?'99+':String(c.n),bw=ctx.measureText(t2).width+8;ctx.fillStyle=col;ctx.beginPath();ctx.roundRect?ctx.roundRect(x+r-4,y-r-8,bw,15,7):ctx.rect(x+r-4,y-r-8,bw,15);ctx.fill();ctx.fillStyle='#0b1424';ctx.fillText(t2,x+r-4+bw/2,y-r);ctx.restore()}
   else if((st||kmW()<4)&&c.it.t.name){ctx.save();ctx.font='600 11px Inter,Inter,sans-serif';ctx.lineJoin='round';ctx.strokeStyle=st?'rgba(255,255,255,.95)':'rgba(10,16,30,.9)';ctx.lineWidth=3;ctx.strokeText(c.it.t.name,x,y+r+11);ctx.fillStyle=st?'#111':'#fff';ctx.fillText(c.it.t.name,x,y+r+11);ctx.restore()}}}
 if(ON.has('weather')&&WX){ctx.textAlign='center';ctx.textBaseline='middle';
  ST.forEach((t,i)=>{const w=WX[i];if(!w)return;const[x,y]=toS(t.x,t.y);if(x<-30||x>W+30||y<-20||y>H+20)return;if(occ.some(o=>Math.abs(o[0]-x)<56&&Math.abs(o[1]-y)<26))return;occ.push([x,y]);
   const tx=WXI(w.weather_code)+' '+Math.round(w.temperature_2m)+'°';ctx.font='700 13px Inter,Inter,sans-serif';const bw=ctx.measureText(tx).width+14;
   ctx.beginPath();ctx.roundRect?ctx.roundRect(x-bw/2,y-11,bw,22,11):ctx.rect(x-bw/2,y-11,bw,22);ctx.fillStyle='rgba(255,255,255,.93)';ctx.fill();ctx.fillStyle='#12223a';ctx.fillText(tx,x,y+1)})}
 ctx.textBaseline='alphabetic'};

const _tap=tap;tap=function(x,y){if(ON.size&&(typeof quiz==='undefined'||!quiz||quiz.done)){let best=null,bd=22;
  for(const q of CL){const d=Math.hypot(q.x-x,q.y-y);if(d<bd){bd=d;best=q}}

 <p class="row" style="gap:8px;flex-wrap:wrap;margin-top:12px"><a class="lb" style="display:inline-flex;align-items:center;text-decoration:none" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${it.lat},${it.lon}">🧭 ${esc(l.route)}</a>${web&&/^https?:\/\//.test(web)?`<a class="lb" style="display:inline-flex;align-items:center;text-decoration:none" target="_blank" rel="noopener" href="${esc(web)}">${esc(l.web)}</a>`:''}</p>
